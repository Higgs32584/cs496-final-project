name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the tests start their own in-memory MongoDB, so no database or secrets are needed
      - run: npm test

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # checks that both images build; nothing is pushed anywhere
      - run: docker build -t prssa-server .
      - run: docker build -t prssa-web my-app
