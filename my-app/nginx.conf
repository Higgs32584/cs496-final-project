server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the site's routes (/CreateMeeting, /Login, ...) only exist in the browser,
    # so anything that is not a real file gets index.html and React Router takes over
    location / {
        try_files $uri /index.html;
    }

    # built files have hashed names, so they can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
